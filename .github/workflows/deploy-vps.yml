name: Deploy Staging to VPS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
  VPS_PORT: ${{ vars.VPS_PORT || '22' }}
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/salon-cash-register' }}
  APP_DOMAIN: ${{ vars.APP_DOMAIN }}

jobs:
  deploy:
    if: ${{ vars.ENABLE_VPS_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate configuration
        shell: bash
        run: |
          test -n "$VPS_HOST" || (echo "Missing VPS_HOST secret" && exit 1)
          test -n "$VPS_USER" || (echo "Missing VPS_USER secret" && exit 1)
          test -n "$VPS_SSH_KEY" || (echo "Missing VPS_SSH_KEY secret" && exit 1)
          test -n "$APP_DOMAIN" || (echo "Missing APP_DOMAIN variable" && exit 1)

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload application files
        shell: bash
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete \
            --exclude ".git" --exclude "node_modules" --exclude "dist" --exclude ".env" \
            -e "ssh -p $VPS_PORT" \
            ./ "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/"

      - name: Build and restart
        shell: bash
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "
            set -eu
            cd '$DEPLOY_PATH'
            printf 'APP_DOMAIN=%s\n' '$APP_DOMAIN' > .env
            docker compose up -d --build --remove-orphans
            docker image prune -f
            docker compose ps
          "

      - name: Health check
        shell: bash
        run: |
          for i in {1..12}; do
            if curl --fail --silent --show-error "https://$APP_DOMAIN/health.json"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
